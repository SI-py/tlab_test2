[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlab-recsys"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["rlrec"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
